config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 1
  payload:
    path: "DiagnoseAndResolveWeakWiFiSignal.csv"
    fields:
      - "subscriberId"
    skipHeader: true
    delimiter: "^|^"
  environments:
    development:
      target: "http://dev.example.com"
    production:
      target: "http://api.example.com"
  plugins:
    expect: {}

scenarios:
  - name: "Diagnose and resolve weak WiFi signal"
    flow:
      - post:
          url: "/appointment"
          json:
            appointment:
              reason: "Diagnostic test for weak WiFi signal"
              slot:
                id: "bff13821-73c3-42cc-9327-b05c7df5a67f"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          log: "Initiating a diagnostic test for weak WiFi signal."
          expect:
            - statusCode: 201
            - hasProperty: "appointment.id"
            - hasProperty: "appointment.finishDate"
            - hasProperty: "appointment.priority.flag"
            - hasProperty: "control.code"
            - hasProperty: "control.message"
          capture:
            json: "$.appointment.id"
            as: "testId"
      - think: 1
      - post:
          url: "/appointmentConfirmation"
          json:
            appointment:
              id: "{{ testId }}"
              confirmation: true
            customer:
              subscriberId: "{{ subscriberId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          log: "Confirming the diagnostic test for weak WiFi signal."
          expect:
            - statusCode: 200
            - hasProperty: "control.code"
            - hasProperty: "control.message"
      - think: 1
      - post:
          url: "/appointment"
          json:
            appointment:
              reason: "Change WiFi channel"
              slot:
                id: "bff13821-73c3-42cc-9327-b05c7df5a67f"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          log: "Changing the WiFi channel to resolve weak signal."
          expect:
            - statusCode: 201
            - hasProperty: "appointment.id"
            - hasProperty: "appointment.finishDate"
            - hasProperty: "appointment.priority.flag"
            - hasProperty: "control.code"
            - hasProperty: "control.message"
      - think: 1
      - get:
          url: "/appointment/{{ testId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          log: "Checking the result after changing the WiFi channel."
          expect:
            - statusCode: 200
            - hasProperty: "appointments.occurrences[0].reason"
            - equals:
                path: "appointments.occurrences[0].reason"
                value: "Change WiFi channel"
            - hasProperty: "appointments.occurrences[0].finishDate"
            - hasProperty: "control.code"
            - hasProperty: "control.message"
